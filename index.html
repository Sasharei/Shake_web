<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Three.js sanity check • v0.1</title>
  <style>
    html,body{height:100%;margin:0;background:#0b1220;color:#cbd5e1;font-family:Inter,system-ui,Segoe UI,Roboto,Arial,sans-serif}
    canvas{display:block}
    #tag{position:fixed;right:10px;top:10px;background:rgba(2,6,23,.7);border:1px solid #334155;border-radius:8px;padding:6px 10px;font-size:12px;z-index:10}
  </style>
</head>
<body>
  <div id="tag">sanity v0.1 • three r160</div>
  <script src="https://unpkg.com/three@0.160.0/build/three.min.js" onload="boot()" defer></script>
  <script>
    function boot(){
      console.log('Three version', THREE.REVISION);
      const renderer = new THREE.WebGLRenderer({antialias:true});
      renderer.setPixelRatio(Math.min(2, window.devicePixelRatio||1));
      renderer.setSize(innerWidth, innerHeight);
      document.body.appendChild(renderer.domElement);
      window.addEventListener('resize', ()=>{
        camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
      });

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0b1220);
      const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 1000);
      camera.position.set(3,2.5,6);

      scene.add(new THREE.AmbientLight(0xffffff, 0.6));
      const dir = new THREE.DirectionalLight(0xffffff, 1.0);
      dir.position.set(5,8,4); scene.add(dir);

      const grid = new THREE.GridHelper(50, 50, 0x1f2937, 0x1f2937);
      grid.position.y = -0.001; scene.add(grid);

      const geo = new THREE.BoxGeometry(1,1,1);
      const mat = new THREE.MeshStandardMaterial({color:0x3b82f6, metalness:0.2, roughness:0.5});
      const cube = new THREE.Mesh(geo, mat); scene.add(cube);

      const clock = new THREE.Clock();
      function tick(){
        const t = clock.getElapsedTime();
        cube.rotation.y = t * 0.6;
        cube.rotation.x = t * 0.3;
        renderer.render(scene, camera);
        requestAnimationFrame(tick);
      }
      tick();
    }
  </script>
</body>
</html>
