<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Meat Loop • Mobile 3D (хижина с балконом, видимый лифт, стопки мяса за спиной)</title>
  <style>
    html, body { height:100%; margin:0; background:#0b1220; color:#e5e7eb; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,system-ui,sans-serif; }
    canvas { display:block; touch-action:none; }
    #hud { position:fixed; left:12px; top:12px; background:rgba(2,6,23,.7); border:1px solid #334155; border-radius:12px; padding:10px 12px; font-size:12px; box-shadow:0 8px 24px rgba(0,0,0,.35); z-index:10; }
    #hud .row { display:flex; gap:10px; align-items:center; white-space:nowrap; }
    .bar { width:160px; height:8px; background:#7f1d1d; border-radius:6px; overflow:hidden; border:1px solid #ef4444; }
    .bar > div { height:100%; width:100%; background:#22c55e; transition:width .12s; }
    #tip { position:fixed; left:50%; transform:translateX(-50%); bottom:8px; opacity:.9; font-size:12px; z-index:10; text-align:center; padding:6px 10px; background:rgba(2,6,23,.55); border:1px solid #334155; border-radius:8px;}
    #joy { position:fixed; left:16px; bottom:16px; width:140px; height:140px; border-radius:50%; background:rgba(15,23,42,.35); border:1px solid #334155; touch-action:none; z-index:11; }
    #joy .knob { position:absolute; left:50%; top:50%; width:64px; height:64px; margin:-32px 0 0 -32px; border-radius:50%; background:rgba(30,41,59,.9); border:2px solid #475569; }
    #dead { position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,.6); z-index:20; }
    #dead .panel { background:#0f172a; border:1px solid #334155; padding:18px 22px; border-radius:12px; box-shadow:0 10px 28px rgba(0,0,0,.5); text-align:center; }
    #dead .panel h1 { margin:0 0 8px; font-size:20px; }
    #dead .panel p { margin:0; opacity:.85; font-size:13px; }
  </style>
</head>
<body>
  <div id="hud">
    <div class="row" style="font-weight:600; margin-bottom:4px;">Meat Loop • Mobile 3D</div>
    <div class="row">Money: <b id="mny">0</b> • Carry: <b id="car">0</b>/<b id="cap">20</b> • Queue↑: <b id="que">0</b></div>
    <div class="row" style="gap:6px; margin-top:6px;">HP: <div class="bar"><div id="php"></div></div></div>
  </div>
  <div id="tip">Лифт теперь <b>спереди</b> у балкона хижины. С грузом вверх не повезёт. За спиной видно <b>стопки мяса</b>.</div>
  <div id="joy"><div class="knob"></div></div>
  <div id="dead"><div class="panel"><h1>Ты умер</h1><p>Респавн через секунду у хижины</p></div></div>

  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
  <script>
    const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
    const rand=(a,b)=>a+Math.random()*(b-a);
    const DPR=Math.min(2, window.devicePixelRatio||1);

    const renderer=new THREE.WebGLRenderer({antialias:true});
    renderer.setPixelRatio(DPR); renderer.setSize(innerWidth,innerHeight);
    renderer.shadowMap.enabled=true;
    document.body.appendChild(renderer.domElement);

    const scene=new THREE.Scene();
    scene.background=new THREE.Color(0x0b1220);
    scene.fog=new THREE.Fog(0x0b1220,14,60);

    const camera=new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 200);
    camera.position.set(0,13.5,18);
    let camTarget=new THREE.Vector3(-9,3,2);
    function updateCamera(){ camera.position.lerp(new THREE.Vector3(camTarget.x, camTarget.y+10.5, camTarget.z+15.5),0.18); camera.lookAt(camTarget); }
    window.addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });

    scene.add(new THREE.AmbientLight(0xffffff,.55));
    const dl=new THREE.DirectionalLight(0xffffff,1.05); dl.position.set(6,14,8); dl.castShadow=true; dl.shadow.mapSize.set(1024,1024); scene.add(dl);
    scene.add(new THREE.HemisphereLight(0x88aaff,0x223355,.25));

    const WORLD={w:40,h:28}, hutY=3.2;

    // Ground and grid
    const floorLow=new THREE.Mesh(new THREE.PlaneGeometry(WORLD.w,WORLD.h), new THREE.MeshStandardMaterial({color:'#0b1220'}));
    floorLow.rotation.x=-Math.PI/2; floorLow.receiveShadow=true; scene.add(floorLow);
    const gridGeo=new THREE.BufferGeometry(); const lines=[];
    for(let x=-WORLD.w/2;x<=WORLD.w/2;x+=WORLD.w/12){lines.push(x,0,-WORLD.h/2,x,0,WORLD.h/2)}
    for(let z=-WORLD.h/2;z<=WORLD.h/2;z+=WORLD.h/12){lines.push(-WORLD.w/2,0,z,WORLD.w/2,0,z)}
    gridGeo.setAttribute('position', new THREE.Float32BufferAttribute(new Float32Array(lines),3));
    const grid=new THREE.LineSegments(gridGeo, new THREE.LineBasicMaterial({color:'#162033'})); grid.position.y=0.01; scene.add(grid);

    // Hut: floor, walls, balcony
    const hut = new THREE.Group(); scene.add(hut);
    const hutFloor = new THREE.Mesh(new THREE.BoxGeometry(14, 0.6, 10), new THREE.MeshStandardMaterial({color:'#0f172a'}));
    hutFloor.position.set(-9, hutY, 0); hutFloor.castShadow=true; hutFloor.receiveShadow=true; hut.add(hutFloor);

    // Walls (thin boxes), front has opening to balcony
    const wallMat = new THREE.MeshStandardMaterial({color:'#111827'});
    const wallThickness = 0.25, wallH = 2.2;
    const backWall = new THREE.Mesh(new THREE.BoxGeometry(14, wallH, wallThickness), wallMat); backWall.position.set(-9, hutY + wallH/2 + 0.3, -5); backWall.castShadow=true; hut.add(backWall);
    const leftWall = new THREE.Mesh(new THREE.BoxGeometry(wallThickness, wallH, 10), wallMat); leftWall.position.set(-16, hutY + wallH/2 + 0.3, 0); leftWall.castShadow=true; hut.add(leftWall);
    const rightWall = new THREE.Mesh(new THREE.BoxGeometry(wallThickness, wallH, 10), wallMat); rightWall.position.set(-2, hutY + wallH/2 + 0.3, 0); rightWall.castShadow=true; hut.add(rightWall);
    // front short segments leaving gap for balcony
    const frontLeft = new THREE.Mesh(new THREE.BoxGeometry(5, wallH, wallThickness), wallMat); frontLeft.position.set(-13.5, hutY + wallH/2 + 0.3, 5); frontLeft.castShadow=true; hut.add(frontLeft);
    const frontRight = new THREE.Mesh(new THREE.BoxGeometry(5, wallH, wallThickness), wallMat); frontRight.position.set(-4.5, hutY + wallH/2 + 0.3, 5); frontRight.castShadow=true; hut.add(frontRight);

    // Balcony platform (extends towards camera, z positive)
    const balcony = new THREE.Mesh(new THREE.BoxGeometry(6, 0.4, 4), new THREE.MeshStandardMaterial({color:'#1f2937'}));
    balcony.position.set(-9, hutY+0.5, 5.8); balcony.castShadow=true; balcony.receiveShadow=true; hut.add(balcony);
    // Simple rails on balcony sides
    const railMat = new THREE.MeshStandardMaterial({color:'#334155'});
    const railL = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.8, 4), railMat); railL.position.set(-12, hutY+1.1, 5.8); hut.add(railL);
    const railR = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.8, 4), railMat); railR.position.set(-6, hutY+1.1, 5.8); hut.add(railR);

    // Grill on hut floor
    const grillBase=new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.6, 1.2), new THREE.MeshStandardMaterial({color:'#3b82f6'}));
    grillBase.position.set(-12.5, hutY+0.6, -2.5); grillBase.castShadow=true; grillBase.receiveShadow=true; hut.add(grillBase);

    // Elevator in front of balcony (clearly visible)
    const elevator={x:-9, z: 8.2, y: hutY+0.1, state:'idle', t:0};
    const liftMesh=new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.3, 2.4), new THREE.MeshStandardMaterial({color:'#64748b'}));
    liftMesh.castShadow=true; liftMesh.receiveShadow=true; scene.add(liftMesh);
    // vertical guide
    const pillar=new THREE.Mesh(new THREE.BoxGeometry(0.3, hutY+0.2, 0.3), new THREE.MeshStandardMaterial({color:'#1f2937'}));
    pillar.position.set(elevator.x, (hutY+0.2)/2, elevator.z); pillar.castShadow=true; pillar.receiveShadow=true; scene.add(pillar);

    // Drop zone on ground
    const dropPos={x:10,z:0};
    const dropOuter=new THREE.Mesh(new THREE.RingGeometry(1.0,1.45,48), new THREE.MeshBasicMaterial({color:'#cbd5e1'}));
    dropOuter.rotation.x=-Math.PI/2; dropOuter.position.set(dropPos.x,0.02,dropPos.z); scene.add(dropOuter);
    const dropInner=new THREE.Mesh(new THREE.CircleGeometry(0.95,48), new THREE.MeshBasicMaterial({color:'#111827'}));
    dropInner.rotation.x=-Math.PI/2; dropInner.position.set(dropPos.x,0.021,dropPos.z); scene.add(dropInner);

    function label(text){
      const c=document.createElement('canvas'); const s=256; c.width=c.height=s; const g=c.getContext('2d');
      g.fillStyle='#111827'; g.fillRect(0,0,s,s); g.fillStyle='#cbd5e1'; g.font='bold 42px system-ui'; g.textAlign='center'; g.textBaseline='middle'; g.fillText(text,s/2,s/2);
      const t=new THREE.CanvasTexture(c); t.anisotropy=4;
      const m=new THREE.MeshBasicMaterial({map:t, transparent:true}); const mesh=new THREE.Mesh(new THREE.PlaneGeometry(1.6,1.6), m); mesh.rotation.x=-Math.PI/2; return mesh;
    }
    const dropLabel=label("СБРОС"); dropLabel.position.set(dropPos.x,0.022,dropPos.z); scene.add(dropLabel);

    // UI refs
    const $mny=document.getElementById('mny'), $car=document.getElementById('car'), $cap=document.getElementById('cap'), $que=document.getElementById('que'), $php=document.getElementById('php');
    const $dead=document.getElementById('dead');
    $cap.textContent=20;

    // State
    const state={
      player:{x:-9, y:hutY+0.9, z:1.5, r:0.6, speed:7.2, carried:0, cap:20, money:5, hp:100, maxhp:100, invul:0, dps:12, atkCd:0, dead:false, respawn:0},
      meats:[], enemies:[], topQueue:0, keys:Object.create(null), last:performance.now()
    };

    // Meshes
    const gCapsule=new THREE.CapsuleGeometry(0.35,0.8,4,12);
    const mPlayer=new THREE.MeshStandardMaterial({color:'#38bdf8',roughness:.65,metalness:.1});
    const playerMesh=new THREE.Mesh(gCapsule,mPlayer); playerMesh.castShadow=true; scene.add(playerMesh);

    // Backpack group to show carried meat stacks (behind player)
    const backpack = new THREE.Group(); backpack.position.set(0, -0.2, -0.55); playerMesh.add(backpack);
    function refreshBackpack(){
      // clear
      while(backpack.children.length) backpack.remove(backpack.children[0]);
      const count = state.player.carried;
      const layerH = 0.12, cube = new THREE.BoxGeometry(0.18,0.1,0.18);
      for(let i=0;i<count;i++){
        const layer = Math.floor(i/4); // 4 per layer
        const pos = i%4;
        const ox = (pos%2===0)? -0.12 : 0.02;
        const oz = (pos<2)? -0.12 : 0.02;
        const m = new THREE.Mesh(cube, new THREE.MeshStandardMaterial({color:'#ef4444'}));
        m.position.set(ox, layer*layerH, oz);
        m.castShadow=true; backpack.add(m);
      }
    }

    const gMeat=new THREE.BoxGeometry(0.22,0.16,0.12), mMeat=new THREE.MeshStandardMaterial({color:'#ef4444'});
    const gEnemy=new THREE.SphereGeometry(0.35,18,18), mEnemy=new THREE.MeshStandardMaterial({color:'#f97316'});

    function makeBar(w=0.7){ const g=new THREE.Group(); const bg=new THREE.Mesh(new THREE.PlaneGeometry(w,0.08), new THREE.MeshBasicMaterial({color:'#7f1d1d'})); const fg=new THREE.Mesh(new THREE.PlaneGeometry(w,0.08), new THREE.MeshBasicMaterial({color:'#22c55e'})); fg.position.set(-w/2,0,0); fg.userData.w=w; g.add(bg); g.add(fg); g.rotation.x=-Math.PI/2; g.position.y=0.95; g.userData.fg=fg; return g; }
    function setBar(gr,ratio){ ratio=clamp(ratio,0,1); gr.userData.fg.scale.x=ratio; gr.userData.fg.position.x=-gr.userData.fg.userData.w/2*(1-ratio); }

    function makeEnemy(x,z){ const mesh=new THREE.Mesh(gEnemy,mEnemy.clone()); mesh.castShadow=true; scene.add(mesh); const bar=makeBar(0.8); mesh.add(bar); return {x,y:0.35,z,r:0.5,speed:5.2,mesh,bar,hp:30,maxhp:30,state:'patrol',t:0,attackCd:0,dead:false,respawn:0}; }
    for(let i=0;i<8;i++) state.enemies.push(makeEnemy(rand(-2,14),rand(-8,8))); // enemies mostly on right/bottom

    function spawnMeatPiece(x,z,vy=2){ const mesh=new THREE.Mesh(gMeat,mMeat); mesh.castShadow=true; scene.add(mesh); const ang=Math.random()*Math.PI*2, s=rand(0.6,1.4); return {x,y:0.3,z,vx:Math.cos(ang)*s,vz:Math.sin(ang)*s,vy,mesh,life:16,pickDelay:0.6}; }

    // Input
    window.addEventListener('keydown',e=> state.keys[e.key.toLowerCase()]=true);
    window.addEventListener('keyup',e=> state.keys[e.key.toLowerCase()]=false);

    const joy=document.getElementById('joy'), knob=joy.querySelector('.knob'); let joyId=null, joyVec={x:0,y:0};
    function joySet(dx,dy){ const r=Math.min(joy.clientWidth,joy.clientHeight)/2-6; const L=Math.hypot(dx,dy); const k=L>r?r/L:1; knob.style.transform=`translate(${dx*k}px,${dy*k}px)`; joyVec.x=(dx*k)/r; joyVec.y=(dy*k)/r; }
    joy.addEventListener('touchstart',e=>{const t=e.changedTouches[0];joyId=t.identifier;const r=joy.getBoundingClientRect();joySet(t.clientX-(r.left+r.width/2),t.clientY-(r.top+r.height/2));},{passive:false});
    joy.addEventListener('touchmove',e=>{for(const t of e.changedTouches){if(t.identifier===joyId){const r=joy.getBoundingClientRect();joySet(t.clientX-(r.left+r.width/2),t.clientY-(r.top+r.height/2)); e.preventDefault();}}},{passive:false});
    function joyReset(){ knob.style.transform=''; joyVec.x=0; joyVec.y=0; joyId=null; }
    joy.addEventListener('touchend',()=>joyReset()); joy.addEventListener('touchcancel',()=>joyReset());

    // Death/respawn
    function killPlayer(){ if(state.player.dead) return; state.player.dead=true; state.player.respawn=1.0; document.getElementById('dead').style.display='flex'; }
    function respawnPlayer(){ state.player.dead=false; document.getElementById('dead').style.display='none'; state.player.x=-9; state.player.z=1.5; state.player.y=hutY+0.9; state.player.hp=state.player.maxhp; state.player.carried=0; document.getElementById('car').textContent='0'; refreshBackpack(); }

    function tick(){
      requestAnimationFrame(tick);
      const now=performance.now(); let dt=Math.min(1/50,(now-state.last)/1000); state.last=now;
      const p=state.player;

      if(p.dead){ p.respawn-=dt; if(p.respawn<=0) respawnPlayer(); renderer.render(scene,camera); return; }

      // Movement
      let dx=0,dz=0;
      if(state.keys['a']||state.keys['arrowleft'])dx-=1;
      if(state.keys['d']||state.keys['arrowright'])dx+=1;
      if(state.keys['w']||state.keys['arrowup'])dz-=1;
      if(state.keys['s']||state.keys['arrowdown'])dz+=1;
      dx+=joyVec.x; dz+=joyVec.y;
      const L=Math.hypot(dx,dz)||1;
      const speedPenalty=1-Math.min(0.6,(p.carried/p.cap)*0.5);
      let nx=p.x+(dx/L)*p.speed*speedPenalty*dt;
      let nz=p.z+(dz/L)*p.speed*speedPenalty*dt;
      nx=clamp(nx,-WORLD.w*0.5+1, WORLD.w*0.5-1); nz=clamp(nz,-WORLD.h*0.5+1, WORLD.h*0.5-1);

      // Elevator logic
      const nearLiftTop=(Math.hypot(nx-elevator.x,nz-elevator.z)<1.1) && p.y>hutY;
      const nearLiftBot=(Math.hypot(nx-elevator.x,nz-elevator.z)<1.1) && p.y<1.0;
      if(elevator.state==='idle'){ if(nearLiftTop){elevator.state='down';} else if(nearLiftBot && p.carried===0){elevator.state='up';} }
      if(elevator.state==='down'){ elevator.y=Math.max(0.1, elevator.y-2.4*dt); if(elevator.y<=0.11){elevator.state='pause';elevator.t=0;} }
      else if(elevator.state==='up'){ elevator.y=Math.min(hutY+0.1, elevator.y+2.4*dt); if(elevator.y>=hutY+0.1){elevator.state='pause';elevator.t=0;} }
      else if(elevator.state==='pause'){ elevator.t+=dt; if(elevator.t>0.5) elevator.state='idle'; }
      liftMesh.position.set(elevator.x, elevator.y, elevator.z);

      // Stick to lift square only
      const onLift=Math.hypot(nx-elevator.x,nz-elevator.z)<1.0;
      if(onLift) p.y=elevator.y+0.8;
      else {
        // on hut if over its bounds (including balcony)
        const overHut = (nx>-16 && nx<-2 && nz>-5 && nz<9);
        p.y = overHut ? (hutY+0.8) : 0.8;
      }

      if(elevator.state==='pause' && elevator.y>hutY && p.carried>0 && onLift){ nx = elevator.x + 1.4; }

      p.x=nx; p.z=nz; playerMesh.position.set(p.x,p.y,p.z);
      camTarget.lerp(new THREE.Vector3(p.x,p.y*0.5+0.6,p.z+0.6),0.22); updateCamera();

      // Auto-attack on bottom
      p.atkCd=Math.max(0,p.atkCd-dt);
      if(p.y<1.5){
        let target=null, best=9e9;
        for(const e of state.enemies){ if(e.dead) continue; const d=Math.hypot(e.x-p.x,e.z-p.z); if(d<best){best=d; target=e;} }
        if(target && best<2.0 && p.atkCd<=0){
          p.atkCd=0.25; target.hp -= p.dps*0.25; target.mesh.scale.set(1.25,1.25,1.25);
          if(target.hp<=0){ 
            target.dead=true; target.respawn=4; target.mesh.visible=false;
            const count=Math.max(1, Math.floor(rand(1,4)));
            for(let i=0;i<count;i++) state.meats.push(spawnMeatPiece(target.x,target.z,rand(2,3.6)));
          }
        }
      }

      // Enemies AI
      for(const e of state.enemies){
        if(e.dead){ e.respawn-=dt; if(e.respawn<=0){ e.dead=false; e.hp=e.maxhp; e.mesh.visible=true; e.mesh.scale.set(1,1,1);} continue; }
        e.t+=dt; e.attackCd=Math.max(0,e.attackCd-dt);
        const dist=Math.hypot(e.x-p.x,e.z-p.z);
        if(p.y<1.5 && dist<7){
          const vx=p.x-e.x, vz=p.z-e.z, L2=Math.hypot(vx,vz)||1; e.x+=(vx/L2)*e.speed*dt; e.z+=(vz/L2)*e.speed*dt;
          if(L2<1.1 && e.attackCd<=0){ e.attackCd=1.1; e.mesh.scale.set(1.3,1.3,1.3);
            if(p.invul<=0){ p.hp=Math.max(0,p.hp-12); p.invul=0.6; if(p.hp<=0) killPlayer(); }
          }
        } else {
          const ang=Math.sin(e.t*0.6+e.x*0.2)*Math.PI; e.x+=Math.cos(ang)*e.speed*0.1*dt; e.z+=Math.sin(ang)*e.speed*0.1*dt;
        }
        e.x=clamp(e.x,-WORLD.w*0.5+1, WORLD.w*0.5-1); e.z=clamp(e.z,-WORLD.h*0.5+1, WORLD.h*0.5-1);
        e.mesh.position.set(e.x,e.y,e.z); setBar(e.bar, e.hp/e.maxhp);
        e.mesh.scale.lerp(new THREE.Vector3(1,1,1), 0.12);
      }

      // Meat physics + pickup with cooldown; update backpack
      let picked = 0;
      for(let i=state.meats.length-1;i>=0;i--){
        const m=state.meats[i];
        m.vy-=9.8*dt; m.x+=m.vx*dt; m.z+=m.vz*dt; m.y+=m.vy*dt;
        if(m.y<0.3){ m.y=0.3; m.vy*=-0.35; m.vx*=0.92; m.vz*=0.92; }
        m.life-=dt; m.pickDelay=Math.max(0,m.pickDelay-dt);
        if(m.life<=0){ scene.remove(m.mesh); state.meats.splice(i,1); continue; }
        m.mesh.position.set(m.x,m.y,m.z);
        if(p.y<1.5 && m.pickDelay<=0 && Math.hypot(m.x-p.x,m.z-p.z)<0.95 && p.carried<p.cap){
          scene.remove(m.mesh); state.meats.splice(i,1); p.carried++; picked++; 
        }
      }
      if(picked>0){ document.getElementById('car').textContent=p.carried; refreshBackpack(); }

      // Drop zone
      const inDrop = (p.y<1.5 && Math.hypot(p.x-dropPos.x, p.z-dropPos.z)<1.25);
      dropOuter.material.color.set(inDrop? '#e2e8f0' : '#cbd5e1');
      if(inDrop && p.carried>0){
        state.topQueue += p.carried; p.carried=0; document.getElementById('car').textContent='0'; document.getElementById('que').textContent=state.topQueue; refreshBackpack();
      }

      if(state.topQueue>0){ state.topQueue=Math.max(0, state.topQueue-2*dt); if(state.topQueue===0){ state.player.money+=5; } document.getElementById('que').textContent=state.topQueue.toFixed(0); }
      document.getElementById('mny').textContent=state.player.money;

      // Player visuals
      p.invul=Math.max(0,p.invul-dt);
      playerMesh.material.emissive=new THREE.Color(p.invul>0?0x224466:0x000000);
      document.getElementById('php').style.width=(p.hp/p.maxhp*100).toFixed(0)+'%';

      playerMesh.rotation.y += (dx!==0||dz!==0 ? 0.0 : 0.0); // keep simple
      renderer.render(scene,camera);
    }
    // Initial placements
    function syncPositions(){
      liftMesh.position.set(elevator.x, elevator.y, elevator.z);
      playerMesh.position.set(state.player.x, state.player.y, state.player.z);
      refreshBackpack();
    }
    syncPositions();
    tick();
  </script>
</body>
</html>
