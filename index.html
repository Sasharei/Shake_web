<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Meat Loop • balcony doorway + moved drop zone</title>
<style>
  html, body { height:100%; margin:0; background:#0b1220; color:#e5e7eb; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,system-ui,sans-serif; }
  canvas { display:block; touch-action:none; }
  #hud { position:fixed; left:12px; top:12px; background:rgba(2,6,23,.7); border:1px solid #334155; border-radius:12px; padding:10px 12px; font-size:12px; box-shadow:0 8px 24px rgba(0,0,0,.35); z-index:10; }
  #hud .row { display:flex; gap:10px; align-items:center; white-space:nowrap; }
  .bar { width:160px; height:8px; background:#7f1d1d; border-radius:6px; overflow:hidden; border:1px solid #ef4444; }
  .bar > div { height:100%; width:100%; background:#22c55e; transition:width .12s; }
  #tip { position:fixed; left:50%; transform:translateX(-50%); bottom:8px; opacity:.9; font-size:12px; z-index:10; text-align:center; padding:6px 10px; background:rgba(2,6,23,.55); border:1px solid #334155; border-radius:8px;}
  #joy { position:fixed; left:16px; bottom:16px; width:140px; height:140px; border-radius:50%; background:rgba(15,23,42,.35); border:1px solid #334155; touch-action:none; z-index:11; }
  #joy .knob { position:absolute; left:50%; top:50%; width:64px; height:64px; margin:-32px 0 0 -32px; border-radius:50%; background:rgba(30,41,59,.9); border:2px solid #475569; }
  #dead { position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,.6); z-index:20; }
  #dead .panel { background:#0f172a; border:1px solid #334155; padding:18px 22px; border-radius:12px; box-shadow:0 10px 28px rgba(0,0,0,.5); text-align:center; }
  #dead .panel h1 { margin:0 0 8px; font-size:20px; }
  #dead .panel p { margin:0; opacity:.85; font-size:13px; }
</style>
</head>
<body>
  <div id="hud">
    <div class="row" style="font-weight:600; margin-bottom:4px;">Meat Loop • Mobile 3D</div>
    <div class="row">Money: <b id="mny">0</b> • Carry: <b id="car">0</b>/<b id="cap">20</b> • Queue↑: <b id="que">0</b></div>
    <div class="row" style="gap:6px; margin-top:6px;">HP: <div class="bar"><div id="php"></div></div></div>
  </div>
  <div id="tip">Проём на балкон открыт. Сброс перенёс вправо от лифта.</div>
  <div id="joy"><div class="knob"></div></div>
  <div id="dead"><div class="panel"><h1>Ты умер</h1><p>Респавн через секунду у хижины</p></div></div>

  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
  <script>
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  const rand=(a,b)=>a+Math.random()*(b-a);
  const DPR=Math.min(2, window.devicePixelRatio||1);

  const renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(DPR); renderer.setSize(innerWidth,innerHeight);
  renderer.shadowMap.enabled=true;
  document.body.appendChild(renderer.domElement);

  const scene=new THREE.Scene();
  scene.background=new THREE.Color(0x0b1220);
  scene.fog=new THREE.Fog(0x0b1220,14,60);

  const camera=new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 220);
  camera.position.set(0,13.5,18);
  let camTarget=new THREE.Vector3(-9,3,2);
  function updateCamera(){ camera.position.lerp(new THREE.Vector3(camTarget.x, camTarget.y+10.5, camTarget.z+15.5),0.18); camera.lookAt(camTarget); }
  window.addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });

  scene.add(new THREE.AmbientLight(0xffffff,.55));
  const dl=new THREE.DirectionalLight(0xffffff,1.05); dl.position.set(6,14,8); dl.castShadow=true; dl.shadow.mapSize.set(1024,1024); scene.add(dl);
  scene.add(new THREE.HemisphereLight(0x88aaff,0x223355,.25));

  const WORLD={w:40,h:28}, hutY=3.2;

  const floorLow=new THREE.Mesh(new THREE.PlaneGeometry(WORLD.w,WORLD.h), new THREE.MeshStandardMaterial({color:'#0b1220'}));
  floorLow.rotation.x=-Math.PI/2; floorLow.receiveShadow=true; scene.add(floorLow);

  // Hut model (minimal, only for reference visuals)
  const hut = new THREE.Group(); scene.add(hut);
  const hutFloor = new THREE.Mesh(new THREE.BoxGeometry(14, 0.6, 10), new THREE.MeshStandardMaterial({color:'#0f172a'}));
  hutFloor.position.set(-9, hutY, 0); hut.add(hutFloor);
  const wallMat = new THREE.MeshStandardMaterial({color:'#111827'});
  const wallH = 2.2, t = 0.25;
  const backWall = new THREE.Mesh(new THREE.BoxGeometry(14, wallH, t), wallMat); backWall.position.set(-9, hutY + wallH/2 + 0.3, -5); hut.add(backWall);
  const leftWall = new THREE.Mesh(new THREE.BoxGeometry(t, wallH, 10), wallMat); leftWall.position.set(-16, hutY + wallH/2 + 0.3, 0); hut.add(leftWall);
  const rightWall = new THREE.Mesh(new THREE.BoxGeometry(t, wallH, 10), wallMat); rightWall.position.set(-2, hutY + wallH/2 + 0.3, 0); hut.add(rightWall);
  const frontLeft = new THREE.Mesh(new THREE.BoxGeometry(5, wallH, t), wallMat); frontLeft.position.set(-13.5, hutY + wallH/2 + 0.3, 5); hut.add(frontLeft);
  const frontRight = new THREE.Mesh(new THREE.BoxGeometry(5, wallH, t), wallMat); frontRight.position.set(-4.5, hutY + wallH/2 + 0.3, 5); hut.add(frontRight);
  const balcony = new THREE.Mesh(new THREE.BoxGeometry(6, 0.4, 4), new THREE.MeshStandardMaterial({color:'#1f2937'}));
  balcony.position.set(-9, hutY+0.5, 5.8); hut.add(balcony);

  // Elevator
  const elevator={x:-9, z: 8.2, y: hutY+0.1, state:'idle', t:0};
  const liftMesh=new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.3, 2.4), new THREE.MeshStandardMaterial({color:'#64748b'}));
  scene.add(liftMesh);

  // Drop moved to the right of the lift
  const dropPos={x:elevator.x+4.2, z:elevator.z};
  const dropOuter=new THREE.Mesh(new THREE.RingGeometry(1.0,1.45,48), new THREE.MeshBasicMaterial({color:'#cbd5e1'}));
  dropOuter.rotation.x=-Math.PI/2; dropOuter.position.set(dropPos.x,0.02,dropPos.z); scene.add(dropOuter);
  const dropInner=new THREE.Mesh(new THREE.CircleGeometry(0.95,48), new THREE.MeshBasicMaterial({color:'#111827'}));
  dropInner.rotation.x=-Math.PI/2; dropInner.position.set(dropPos.x,0.021,dropPos.z); scene.add(dropInner);

  // Minimal player just to test collisions
  const player={x:-9,y:hutY+0.9,z:1.5,speed:7.2}; const g=new THREE.CapsuleGeometry(0.35,0.8,4,12); const m=new THREE.MeshStandardMaterial({color:'#38bdf8'}); const pm=new THREE.Mesh(g,m); scene.add(pm);

  const keys={}; addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true); addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

  // Collision helpers
  function hutBounds(x,z){ return (x>-16 && x<-2 && z>-5 && z<9); }
  function blockByWalls(nx,nz){
    // Doorway opening centered at x=-9 with width 3.2, at z≈5
    const doorHalfW=1.6;
    const inDoor = (Math.abs(nx+9) < doorHalfW) && (nz>4.6 && nz<6.6);
    // Interior room box (no balcony)
    const insideRoom = (nx>-16 && nx<-2 && nz>-5 && nz<5);
    if(insideRoom && !inDoor){
      nx = clamp(nx, -16+0.6, -2-0.6);
      nz = clamp(nz, -5+0.6, 5-0.6);
    }
    return {x:nx,z:nz};
  }

  function tick(){
    requestAnimationFrame(tick);
    let dt=1/60;

    // movement
    let dx=0,dz=0;
    if(keys['a']||keys['arrowleft'])dx-=1;
    if(keys['d']||keys['arrowright'])dx+=1;
    if(keys['w']||keys['arrowup'])dz-=1;
    if(keys['s']||keys['arrowdown'])dz+=1;
    const L=Math.hypot(dx,dz)||1;
    let nx=player.x+(dx/L)*player.speed*dt;
    let nz=player.z+(dz/L)*player.speed*dt;

    const nearLiftTop=(Math.hypot(nx-elevator.x,nz-elevator.z)<1.1) && player.y>hutY;
    const nearLiftBot=(Math.hypot(nx-elevator.x,nz-elevator.z)<1.1) && player.y<1.0;
    if(elevator.state==='idle'){ if(nearLiftTop){elevator.state='down';} else if(nearLiftBot){elevator.state='up';} }
    if(elevator.state==='down'){ elevator.y=Math.max(0.1, elevator.y-2.4*dt); if(elevator.y<=0.11){elevator.state='pause';elevator.t=0;} }
    else if(elevator.state==='up'){ elevator.y=Math.min(hutY+0.1, elevator.y+2.4*dt); if(elevator.y>=hutY+0.1){elevator.state='pause';elevator.t=0;} }
    else if(elevator.state==='pause'){ elevator.t+=dt; if(elevator.t>0.5) elevator.state='idle'; }
    liftMesh.position.set(elevator.x, elevator.y, elevator.z);

    const onLift=Math.hypot(nx-elevator.x,nz-elevator.z)<1.0;
    if(onLift) player.y=elevator.y+0.8;
    else player.y = hutBounds(nx,nz)?(hutY+0.8):0.8;

    if(player.y>hutY){ const res=blockByWalls(nx,nz); nx=res.x; nz=res.z; }

    player.x=nx; player.z=nz; pm.position.set(player.x,player.y,player.z);
    camera.lookAt(pm.position);
    renderer.render(scene,camera);
  }
  tick();
  </script>
</body>
</html>
